name: Test

on:
  push:
    branches: [ "migrate-to-plugin-framework" ]
  pull_request:
    branches: [ "migrate-to-plugin-framework" ]

env:
  CONFIG_DIRECTORY: "./"
  PRISMACLOUDCOMPUTE_CONSOLE_URL: "${{ secrets.PCC_CONSOLE_URL }}"
  PRISMACLOUDCOMPUTE_USERNAME: "${{ secrets.PCC_USERNAME }}"
  PRISMACLOUDCOMPUTE_PASSWORD: "${{ secrets.PCC_PASSWORD }}"

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Get public IP
        id: ip
        uses: haythem/public-ip@v1.3
      - name: Update security group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_TEST_SG_ID }} \
            --protocol tcp \
            --port 8083 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 \
            > /dev/null 2>&1
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
      - name: Install dependencies
        run: go get .
      - name: Build
        run: go build -o terraform-provider-prismacloudcompute
      - run: go test -v ./internal/acceptance/...
        env:
          TF_ACC: '1'
      - name: Revoke security group ingress 
        run: |
          aws ec2 revoke-security-group-ingress \
          --group-id ${{ secrets.AWS_TEST_SG_ID }} \
          --protocol tcp \
          --port 8083 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32 \
          > /dev/null 2>&1
        if: always()
